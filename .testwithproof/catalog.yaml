version: 1
features:
  - id: file-browser
    title: 六工坊旧版文件管理与素材选择
    criteria:
      - id: file-browser.rebuild
        title: 非空文件页、目录操作及真实编辑器选用
        expected: 六个工坊在隔离账号中展示真实文件和缩略图，紧凑工具栏、目录管理、预览、明暗与窄屏正常；项目附件与原生素材均可见，编辑器选用后结果保持，移除引用保留原件，未登录读取被拒绝。
        tests: [{executor: fileBrowser, id: file-browser.rebuild}]
        evidence: [steps, file, screenshot, trace]
        reviewRequired: true
  - id: distribution
    title: 独立服务随插件分发
    criteria:
      - id: distribution.payloads
        title: 七个载荷和公开契约
        expected: 七份包的摘要、文件清单、平台和入口匹配，缺少可选 inventory 时 Core 可导入。
        tests: [{executor: packages, id: distribution.payloads}]
        evidence: [steps, file]
        reviewRequired: false
  - id: managed-setup
    title: 两代真实 DSH 安装、授权与原生工具
    description: Apple Silicon 实测；Intel 仅静态检查；真实付费供应商不在本轮范围。
    criteria:
      - id: managed-setup.current
        title: 桌面内置 DSH 0.2.2-rc.1
        expected: 七服务安装启动，证明授权，六工坊原生读写与资源交接，安装设置可见，正常停止。
        tests: [{executor: hosts, id: managed-setup.current}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: managed-setup.next
        title: npm DSH 0.2.2-rc.5 与 uv 缺失
        expected: 缺 uv 时准备固定工具；缺 FFmpeg 可诊断；其余安装、授权、工具和页面与当前版一致。
        tests: [{executor: hosts, id: managed-setup.next}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
  - id: protocol-regression
    title: 提供方回归和异常路径
    criteria:
      - id: protocol-regression.all
        title: 七插件构建与自动测试
        expected: 授权、CAS、幂等、取消、传输清理、公开类型和既有业务测试通过；模拟依赖明确标识。
        tests: [{executor: regressions, id: protocol-regression.all}]
        evidence: [steps, file]
        reviewRequired: false
  - id: independent-workflows
    title: 七服务业务与界面联动
    description: 真实 HTTP/WS、Chrome、FFmpeg；仅供应商和外部账号由提供方公开夹具模拟。
    criteria:
      - id: independent-workflows.all
        title: 账号隔离、导出、ASR 和跨工坊交接
        expected: 公开组合验收通过，七服务页面无脚本/API 错误，宽屏、860 和 390 像素界面留下证据。
        tests: [{executor: workflows, id: independent-workflows.all}]
        evidence: [steps, file, screenshot]
        reviewRequired: true

  - id: embedded-desktop
    title: Core 库化与独立桌面迁移
    description: macOS Apple Silicon；按视觉、剪辑、演示、思绪、Galgame、录音标注顺序迁移。
    criteria:
      - id: embedded-desktop.visual
        title: 视觉打包应用不依赖外部 Core
        expected: 包内 Python 启动，自动建立产品会话，模型与集成页面可见，退出后后端正常停止。
        tests: [{executor: desktop, id: embedded-desktop.visual}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: embedded-desktop.migration
        title: 旧数据迁移与恢复
        expected: 显式迁移保留项目、账号、引用与任务回执，重复导入和中断恢复不重复执行。
        tests: [{executor: visualMigration, id: embedded-desktop.migration}]
        evidence: [steps, file]
        reviewRequired: true
      - id: embedded-desktop.video
        title: 视频剪辑工坊独立桌面
        expected: 无外部 Core 启动，公共页面可用，项目入口直达本工坊列表，媒体工具随包交付并正常关闭。
        tests: [{executor: desktopVideo, id: embedded-desktop.video}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: embedded-desktop.presentation
        title: 演示工坊独立桌面
        expected: 无外部 Core 启动，公共页面可用，项目入口直达本工坊列表，媒体工具随包交付并正常关闭。
        tests: [{executor: desktopPresentation, id: embedded-desktop.presentation}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: embedded-desktop.thought
        title: 思绪工坊独立桌面
        expected: 无外部 Core 启动，公共页面可用，项目入口直达本工坊列表，媒体工具随包交付并正常关闭。
        tests: [{executor: desktopThought, id: embedded-desktop.thought}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: embedded-desktop.galgame
        title: Galgame 工坊独立桌面
        expected: 无外部 Core 启动，公共页面可用，项目入口直达本工坊列表，媒体工具随包交付并正常关闭。
        tests: [{executor: desktopGalgame, id: embedded-desktop.galgame}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: embedded-desktop.audio
        title: 录音标注工坊独立桌面
        expected: 无外部 Core 启动，公共页面可用，项目入口直达本工坊列表，媒体工具随包交付并正常关闭。
        tests: [{executor: desktopAudio, id: embedded-desktop.audio}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: embedded-desktop.remaining
        title: 跨工坊与 DSH 组合
        expected: 五工坊独立桌面运行，跨工坊交接和 DSH 可选连接通过。
        tests: []
        evidence: [steps, file, screenshot]
        reviewRequired: true

  - id: desktop-recovery
    title: 真实数据恢复与六工坊界面收尾
    criteria:
      - id: desktop-recovery.ui
        title: 首页、品牌素材、菜单与添加连接
        expected: 六个本机候选显示创意、集成、AI 能力三个区域，红莉栖素材正常，重复顶栏和 DSH 迁移按钮移除，飞书与 DSH 合并下拉，设置从应用菜单进入。
        tests: [{executor: recoveryUi, id: desktop-recovery.ui}]
        evidence: [steps, file, screenshot]
        reviewRequired: true
      - id: desktop-recovery.data
        title: 真实项目和模型零丢失恢复
        expected: 六个真实目标由提供方核验原有主键完整，数据库和外键通过；所有启用的本地模型已恢复，原始来源和桌面副本保留。
        tests: [{executor: recoveryData, id: desktop-recovery.data}]
        evidence: [steps, file]
        reviewRequired: true
      - id: desktop-recovery.identity
        title: 历史账号映射与重启可见性
        expected: 旧本机 owner 与原 Core 账号两种来源都保留原业务身份，重复修复不改变业务所有者，重启后原项目与资源可见。
        tests: [{executor: visualMigration, id: embedded-desktop.migration}]
        evidence: [steps, file]
        reviewRequired: true
      - id: desktop-recovery.cache-upgrade
        title: 更新界面缓存并保留本地数据
        expected: 保留旧占位图缓存的桌面状态升级后读取原素材，原账号身份与 localStorage 内容保持。
        tests: [{executor: cacheUpgrade, id: desktop-recovery.cache-upgrade}]
        evidence: [steps, file]
        reviewRequired: false
